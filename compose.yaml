services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: council
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-council}
      POSTGRES_DB: council
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - council_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U council -d council"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  council_pg:
